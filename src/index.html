<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relationship Check-In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #fdf2f8);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #f3d6e4);
      --border-mid: var(--hub-border, #e9b8ce);
      --text: var(--hub-text, #3f1d2e);
      --muted: var(--hub-text-muted, #9d6b81);
      --accent: var(--hub-primary, #be185d);
      --accent-hover: var(--hub-primary-hover, #9d174d);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 12px);
      --shadow: 0 1px 3px rgba(80, 20, 50, .08);
    }
    body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif); font-size: var(--hub-font-size, 15px); line-height: 1.55; }
    .app { max-width: 620px; margin: 0 auto; padding: 18px 16px 40px; }
    .head { text-align: center; margin-bottom: 18px; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-bottom: 6px; }
    .muted { color: var(--muted); } .tiny { font-size: .8rem; }
    .center { text-align: center; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
    .prompt { font-size: 1.05rem; font-weight: 650; margin-bottom: 8px; }
    .prompt-badge { display: inline-block; font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); background: var(--hub-tint-accent, #fce7f3); border-radius: 999px; padding: 2px 9px; margin-bottom: 8px; }
    textarea { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 10px; padding: 10px 12px; font: inherit; background: var(--surface); color: var(--text); min-height: 84px; resize: vertical; }
    textarea:focus { outline: none; border-color: var(--accent); }
    input[type=text] { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 10px; padding: 10px 12px; font: inherit; background: var(--surface); color: var(--text); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 999px; padding: 11px 20px; font: inherit; font-size: .92rem; font-weight: 750; cursor: pointer; background: var(--accent); color: var(--accent-fg); }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-block { width: 100%; }
    .btn-ghost { background: transparent; color: var(--accent); border-color: var(--border-mid); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-sm { padding: 6px 12px; font-size: .8rem; }
    .members { display: grid; gap: 8px; margin: 12px 0; }
    .member-opt { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--border-mid); border-radius: 12px; padding: 11px 13px; cursor: pointer; }
    .member-opt:hover { border-color: var(--accent); }
    .member-opt input { accent-color: var(--accent); }
    .answer-block { margin-top: 12px; }
    .answer-block .who { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 3px; }
    .answer-block .txt { background: var(--bg); border-radius: 10px; padding: 9px 12px; white-space: pre-wrap; }
    .answer-block.mine .txt { background: var(--hub-tint-info, #eef6ff); }
    .progress { height: 7px; background: var(--hub-tint-accent, #fce7f3); border-radius: 999px; overflow: hidden; margin: 10px 0; }
    .progress > span { display: block; height: 100%; background: var(--accent); }
    .customs { margin-top: 8px; }
    .custom-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .85rem; padding: 6px 0; border-top: 1px dashed var(--border); }
    .link { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; padding: 0; }
    .waiting-emoji { margin-bottom: 6px; }
    .error { background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); padding: 9px 12px; border-radius: 10px; margin-bottom: 12px; font-size: .86rem; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(60,10,40,.4); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal { background: var(--surface); border-radius: 14px; padding: 20px; width: 100%; max-width: 420px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: .9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 4px 10px; color: inherit; font: inherit; cursor: pointer; white-space: nowrap; }
    .char-count { text-align: right; font-size: .74rem; color: var(--muted); margin-top: 4px; }
  </style>
  <base href="/run/relationship-checkin/">
</head>
<body>
<div class="app">
  <div id="root" class="center muted" style="padding:40px;">Loading…</div>
</div>

<script type="module">
import { esc, hubConfirm, hubToday, glyph, chickadee } from "/hub-sdk.js";

// The household's calendar day as a Date, for the pure helpers in logic.js.
// Those helpers default their date parameter to `new Date()` — the VIEWER
// DEVICE's calendar — but they compare it against dates STORED on the household
// calendar, which is what every server-side surface (glance, kiosk, cron,
// `:today` in declared SQL) reports. Near midnight, or for a member in another
// timezone, the two name different days. logic.js stays pure and SDK-free, so
// the household day is supplied here. Noon keeps a DST shift from tipping it
// into an adjacent day.
const hubDay = () => new Date(`${hubToday()}T12:00:00`);

import { buildQuestions, allAnswered, answeredCount, weeklyPrompt, failureLine, readBackFirst, storedDiffers } from "./logic.js";

const APP_ID = window.__APP_ID ?? "relationship-checkin";
const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const ME = window.__CURRENT_MEMBER ?? null;

let members = [];
let partner = null;
let partnerReciprocal = false;
let partnerSessionId = null;
let customs = [];
let myAnswers = {};
let mySubmission = null;       // { submitted_at, revealed_at } | null
let partnerSubmission = null;  // { submitted_at, revealed_at } | null
let partnerAnswers = {};
let error = "";
let modalEl = null;
let pollTimer = null;

function nowIso() { return new Date().toISOString(); }
function api(path) { return `/run/${APP_ID}/api/${path}`; }

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
  const json = await res.json().catch(() => null);
  // The status (and `code`) pick the line shown; the hub's text stays in the console.
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || "Couldn’t reach the hub. Try again."), { status: res.status, code: json?.code });
  return json;
}

async function post(path, body) {
  const res = await fetch(api(path), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json.error ?? "Request failed"), { status: res.status, code: json.code });
  return json;
}

// ── loading ──────────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [{ id: "demo-1", name: "You", role: "adult" }, { id: "demo-2", name: "Sam", role: "adult" }];
    return;
  }
  const r = await fetch(`${CONTEXT}?keys=family.members`);
  const ctx = await r.json().catch(() => null);
  if (!r.ok || !ctx || typeof ctx !== "object" || ctx.$errors?.length) throw new Error("Couldn’t reach the hub. Try again.");
  members = ctx["family.members"] ?? [];
}

// Who I am paired with, and where the check-in stands, in one request. The
// reveal status names the partner, the session and whether the pairing is
// mutual beside both submissions — everything the separate partner lookup
// returned — so opening the app no longer asks for the partner and then, once
// that has answered, for a status that re-reads the same pairing.
async function loadPartner() {
  if (!ME) { partner = members.find(m => m.id !== "demo-1") ?? { id: "demo-2", name: "Sam" }; partnerReciprocal = true; partnerSessionId = "demo-session"; return; }
  const res = await fetch(api("mutual-reveal"));
  // An unpaired member is answered 200 with partner_id null. Any other answer
  // is a failed read and throws: it is not "no partner yet", and setup must not
  // be drawn as though the pairing were gone.
  if (!res.ok) throw new Error("Couldn’t reach the hub. Try again.");
  const s = await res.json();
  if (!s || typeof s !== "object" || !("partner_id" in s)) throw new Error("Couldn’t reach the hub. Try again.");
  partnerReciprocal = !!s.reciprocal;
  partnerSessionId = s.session_id ?? null;
  mySubmission = s.mine ?? null;
  partnerSubmission = s.theirs ?? null;
  if (s.partner_answers) partnerAnswers = s.partner_answers;
  partner = s.partner_id ? { id: s.partner_id, name: "Partner" } : null;
}

/** The partner as a household member, once the member list is in. */
function namePartner() {
  if (partner) partner = members.find(m => m.id === partner.id) ?? partner;
}

async function loadStatus() {
  if (!ME) return;
  const res = await fetch(api("mutual-reveal"));
  if (!res.ok) return;
  const s = await res.json();
  partnerReciprocal = !!s.reciprocal;
  partnerSessionId = s.session_id ?? partnerSessionId;
  mySubmission = s.mine;
  partnerSubmission = s.theirs;
  if (s.partner_answers) partnerAnswers = s.partner_answers;
}

async function loadCustoms() {
  if (!DB) { customs = []; return; }
  try {
    // The session comes from my own partner_config row, by a join, so this
    // read (and the one for my answers) waits on nothing and takes only my
    // member id: the hub can answer both from the document. The text must
    // match manifest.preload exactly.
    const r = await db("SELECT q.id, q.text, q.created_by, q.created_at FROM app_relationship_checkin__custom_questions q JOIN app_relationship_checkin__partner_config p ON p.session_id = q.session_id WHERE p.member_id = ? ORDER BY q.created_at ASC", [ME?.id ?? null]);
    customs = r.rows;
  } catch (e) { customs = []; console.error(e); error = "Couldn’t load your prompts."; dataLoadFailed = true; }
}

async function loadMyAnswers() {
  if (!DB || !ME) return;
  try {
    const r = await db("SELECT r.question_id, r.answer FROM app_relationship_checkin__responses r JOIN app_relationship_checkin__partner_config p ON p.member_id = r.member_id AND p.session_id = r.session_id WHERE r.member_id = ?", [ME.id]);
    myAnswers = Object.fromEntries(r.rows.map(x => [x.question_id, x.answer]));
  } catch (e) { myAnswers = {}; console.error(e); error = "Couldn’t load your answers."; dataLoadFailed = true; }
}

// Set when the prompts or my answers could not be read.
let dataLoadFailed = false;

// The first load. When the pairing, or the prompts and answers asked for
// beside it, cannot be read, only a banner with a retry is drawn: no setup
// screen, and no questionnaire with prompts or answers missing.
async function refresh() {
  error = "";
  dataLoadFailed = false;
  stopPolling();
  try {
    // None of these waits on another. Someone not yet paired gets no prompts
    // and no answers back, which is what the setup screen shows anyway.
    await Promise.all([loadMembers(), loadPartner(), loadCustoms(), loadMyAnswers()]);
  } catch { error = ""; return render(renderLoadError("your partner")); }
  if (dataLoadFailed) { error = ""; return render(renderLoadError("your check-in")); }
  namePartner();
  route();
}

function questions() { return buildQuestions(customs, hubDay()); }

// ── actions ──────────────────────────────────────────────────────────────────
async function savePartner(partnerId) {
  try {
    if (ME) {
      const s = await post("partner", { partner_id: partnerId });
      partnerReciprocal = !!s.reciprocal;
      partnerSessionId = s.session_id ?? null;
    }
    partner = members.find(m => m.id === partnerId) ?? null;
    if (!ME) { partnerReciprocal = true; partnerSessionId = "demo-session"; }
    if (partner && partnerReciprocal) await Promise.all([loadStatus(), loadCustoms(), loadMyAnswers()]);
    route();
  } catch (e) { console.error(e); showError(failureLine(e, { action: "save your partner", thing: "partner" })); }
}

async function lockIn() {
  const qs = questions();
  const answers = {};
  for (const q of qs) {
    const el = document.getElementById(`ans-${q.id}`);
    answers[q.id] = el ? el.value : (myAnswers[q.id] ?? "");
  }
  myAnswers = answers;
  if (!allAnswered(qs, answers)) { showError("Answer every prompt before locking in."); return; }

  const btn = document.getElementById("lockin-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Locking in…"; }
  try {
    if (ME) {
      for (const q of qs) await post("mutual-reveal", { action: "answer", question_id: q.id, answer: answers[q.id].trim() });
      const s = await post("mutual-reveal", { action: "submit" });
      mySubmission = s.mine; partnerSubmission = s.theirs;
    } else {
      mySubmission = { submitted_at: nowIso(), revealed_at: null };
      partnerSubmission = { submitted_at: nowIso(), revealed_at: null }; // demo partner auto-locks
    }
    route();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Lock in my answers"; }
    console.error(e);
    // A 409 (a prompt the partner added, or answers already locked by a try
    // whose answer was lost) or an unknown outcome: re-read before saying anything.
    if (ME && (e?.status === 409 || readBackFirst(e))) {
      await rereadCheckin(true);
      if (mySubmission?.submitted_at) { route(); return; }
      route();
    }
    showError(failureLine(e, { action: "lock in your answers", thing: "check-in" }));
  }
}

// After a 409 or an unknown outcome: read the pairing and the check-in back so
// the screen shows what is stored. A failed read keeps what is on screen.
async function rereadCheckin(withCustoms) {
  try {
    await Promise.all([loadPartner(), withCustoms ? loadCustoms() : null]);
    namePartner();
  } catch (e) { console.error(e); }
}

async function reveal() {
  const btn = document.getElementById("reveal-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Revealing…"; }
  try {
    if (ME) {
      const s = await post("mutual-reveal", { action: "reveal" });
      mySubmission = s.mine; partnerSubmission = s.theirs;
      partnerAnswers = s.partner_answers ?? {};
      if (!partnerSubmission?.revealed_at) { await loadStatus(); }
    } else {
      mySubmission = { ...mySubmission, revealed_at: nowIso() };
      partnerSubmission = { ...partnerSubmission, revealed_at: nowIso() };
      partnerAnswers = Object.fromEntries(questions().map(q => [q.id, "(In the real app, your partner's answer appears here.)"]));
    }
    route();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Reveal together"; }
    console.error(e);
    // A 409: the pairing changed (or nothing is submitted); show the real state.
    if (ME && e?.status === 409) { await rereadCheckin(false); route(); }
    showError(failureLine(e, { action: "reveal the answers", thing: "check-in" }));
  }
}

async function startNew() {
  const ok = await hubConfirm({ message: "Start a fresh check-in?", description: "This clears your answers so you can go again. Your partner does the same on their side.", confirmLabel: "Start fresh" });
  if (!ok) return;
  try {
    if (ME) await post("mutual-reveal", { action: "reset" });
    myAnswers = {}; mySubmission = null; partnerSubmission = null; partnerAnswers = {};
    route();
  } catch (e) {
    console.error(e);
    if (ME && e?.status === 409) { await rereadCheckin(false); route(); }
    showError(failureLine(e, { action: "start a fresh check-in", thing: "check-in" }));
  }
}

async function addCustom(text) {
  const t = text.trim();
  if (!t) return;
  // The id is the open form's, minted on its first Add and sent on every retry:
  // a try whose answer was lost may have stored the prompt.
  const id = modalEl ? (modalEl.dataset.rowId ||= `custom-${crypto.randomUUID()}`) : `custom-${crypto.randomUUID()}`;
  let row = { id, text: t, created_by: ME?.id ?? "demo-1", created_at: nowIso() };
  let note = "";
  try {
    if (DB) {
      try {
        await db(
          "INSERT INTO app_relationship_checkin__custom_questions (id, created_by, text, session_id, created_at) VALUES (?, ?, ?, ?, ?)",
          [id, row.created_by, t, partnerSessionId, row.created_at]
        );
      } catch (e) {
        // Unknown outcome: read back by the pinned id. Found means an earlier try landed.
        if (!readBackFirst(e)) throw e;
        const stored = await db("SELECT id, text, created_by, created_at FROM app_relationship_checkin__custom_questions WHERE id = ?", [id])
          .then(r => r.rows?.[0] ?? null, e2 => { console.error(e2); return null; });
        if (!stored) throw e;
        console.error(e);
        if (storedDiffers(stored, { text: t })) note = "Added as first entered — remove it and add it again to change it.";
        row = stored;
      }
    }
    if (!customs.some(c => c.id === row.id)) customs = [...customs, row];
    closeModal();
    route();
    if (note) showError(note);
  } catch (e) { console.error(e); showError(failureLine(e, { action: "add the prompt", thing: "prompt" })); }
}

/**
 * Removing a custom prompt also removes both partners' answers to it, through
 * `manifest.delete_cascades`. It has to happen hub-side: `responses` is
 * owner_only + endpoint_writes_only, so no app SQL may ever delete a response
 * row, and the mutual-reveal endpoint only ever writes them. Without the
 * cascade the answers to a deleted question were invisible (the prompt they
 * belonged to was gone), undeletable by anyone, and cleared only if that member
 * later hit "Start fresh" — which wipes every answer they have, including the
 * ones they meant to keep.
 */
async function removeCustom(id) {
  try {
    if (DB) {
      const res = await db("DELETE FROM app_relationship_checkin__custom_questions WHERE id = ?", [id]);
      // Only the partner who wrote a prompt may remove it; the hub answers
      // anyone else with zero rows rather than an error.
      if (!Number(res.changed ?? 0)) {
        dataLoadFailed = false;
        await loadCustoms();
        const found = dataLoadFailed ? undefined : customs.some(c => c.id === id);
        route();
        showError(failureLine(null, { action: "remove the prompt", thing: "prompt", found }));
        return;
      }
    }
    customs = customs.filter(c => c.id !== id);
    delete myAnswers[id];
    route();
  } catch (e) { console.error(e); showError(failureLine(e, { action: "remove the prompt", thing: "prompt" })); }
}

// ── polling on waiting screens ───────────────────────────────────────────────
function startPolling() {
  stopPolling();
  if (!ME) return;
  pollTimer = setInterval(async () => {
    try { await loadStatus(); route(); } catch {}
  }, 5000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ── modal ────────────────────────────────────────────────────────────────────
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  const f = modalEl.querySelector("[data-autofocus]");
  if (f) f.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

function showError(m) { error = m; const box = document.getElementById("err"); if (box) { box.textContent = m; box.style.display = "block"; } }

// ── views ────────────────────────────────────────────────────────────────────
// `view` names the route destination this shell is rendering. #root is replaced
// wholesale on every route, so exactly one view marker exists at a time and a
// scenario can settle on the state it means to assert before asserting in it.
function shell(inner, view) {
  return `
    <div class="head">
      <h1>${glyph("messages")} Relationship Check-In</h1>
      <p class="muted tiny">Answer privately, then reveal together.</p>
    </div>
    <div id="err" class="error" style="display:${error ? "block" : "none"}">${esc(error)}</div>
    <div data-testid="view-${view}">${inner}</div>
  `;
}

function renderLoadError(thing) {
  return shell(`<div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load ${thing}.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`, "load-error");
}

function renderSetup() {
  const others = members.filter(m => m.id !== ME?.id);
  return shell(`
    <div class="card">
      <h2>Who are you checking in with?</h2>
      <p class="muted tiny">Pick your partner. They'll pick you back, and then you're connected privately.</p>
      <div class="members">
        ${others.length ? others.map(m => `
          <label class="member-opt">
            <input type="radio" name="partner" value="${esc(m.id)}" />
            <span>${esc(m.name)}</span>
          </label>`).join("") : `<p class="muted">No one else in the household yet.</p>`}
      </div>
      <button class="btn btn-block" data-save-partner ${others.length ? "" : "disabled"}>Connect</button>
    </div>
  `, "setup");
}

function renderWaitingReciprocal() {
  return shell(`
    <div class="card center">
      <div class="waiting-emoji">${chickadee("waiting", { size: 72 })}</div>
      <h2>Waiting for ${esc(partner?.name ?? "your partner")}</h2>
      <p class="muted">You've chosen them. Once they choose you back, you can start your first check-in.</p>
      <button class="btn btn-ghost btn-sm" data-refresh style="margin-top:10px;">Check again</button>
    </div>
  `, "waiting-reciprocal");
}

function renderQuestionnaire() {
  const qs = questions();
  const done = answeredCount(qs, currentAnswers());
  return shell(`
    <div class="card">
      <div class="prompt-badge">This week's prompt</div>
      <div class="prompt">${esc(qs[0].text)}</div>
      <textarea id="ans-weekly" placeholder="Your honest answer — just for the two of you.">${esc(myAnswers.weekly ?? "")}</textarea>
    </div>
    ${qs.slice(1).map(q => `
      <div class="card">
        <div class="prompt-badge">Your prompt</div>
        <div class="prompt">${esc(q.text)}</div>
        <textarea id="ans-${esc(q.id)}" placeholder="Your answer">${esc(myAnswers[q.id] ?? "")}</textarea>
        <div class="center" style="margin-top:8px;"><button class="link" data-remove-custom="${esc(q.id)}">Remove this prompt</button></div>
      </div>`).join("")}
    <div class="card">
      <button class="link" data-add-custom>＋ Add your own prompt</button>
      <div class="progress"><span style="width:${qs.length ? Math.round(done / qs.length * 100) : 0}%"></span></div>
      <p class="tiny muted center">Your answers stay private until you've both locked in and revealed.</p>
      <button class="btn btn-block" id="lockin-btn" data-lockin>Lock in my answers</button>
    </div>
  `, "questionnaire");
}

function renderWaitingPartner() {
  return shell(`
    <div class="card center">
      <div class="waiting-emoji">${chickadee("locked", { size: 72 })}</div>
      <h2>Locked in!</h2>
      <p class="muted">Your answers are sealed. We'll reveal them the moment ${esc(partner?.name ?? "your partner")} locks in too.</p>
      <button class="btn btn-ghost btn-sm" data-refresh style="margin-top:10px;">Check again</button>
    </div>
  `, "waiting-partner");
}

function renderRevealGate() {
  const iRevealed = !!mySubmission?.revealed_at;
  if (iRevealed) {
    return shell(`
      <div class="card center">
        <div class="waiting-emoji">${chickadee("waiting", { size: 72 })}</div>
        <h2>Ready when they are</h2>
        <p class="muted">You've revealed. As soon as ${esc(partner?.name ?? "your partner")} taps reveal, you'll see each other's answers.</p>
        <button class="btn btn-ghost btn-sm" data-refresh style="margin-top:10px;">Check again</button>
      </div>
    `, "reveal-sent");
  }
  return shell(`
    <div class="card center">
      <div class="waiting-emoji">${chickadee("pair", { size: 72 })}</div>
      <h2>You're both locked in</h2>
      <p class="muted">Reveal together to see each other's answers at the same time.</p>
      <button class="btn btn-block" id="reveal-btn" data-reveal style="margin-top:12px;">Reveal together</button>
    </div>
  `, "reveal");
}

function renderResults() {
  const qs = questions();
  return shell(`
    <div class="card center">
      <h2>Your check-in ${glyph("two-hearts")}</h2>
      <p class="muted tiny">No scoring, no right answers — just a place to start talking.</p>
    </div>
    ${qs.map(q => `
      <div class="card" data-testid="result-card" data-question-id="${esc(q.id)}">
        <div class="prompt">${esc(q.text)}</div>
        <div class="answer-block mine">
          <div class="who">You</div>
          <div class="txt" data-testid="answer-text" data-who="me" data-answered="${myAnswers[q.id] ? "yes" : "no"}">${esc(myAnswers[q.id] ?? "—")}</div>
        </div>
        <div class="answer-block">
          <div class="who">${esc(partner?.name ?? "Partner")}</div>
          <div class="txt" data-testid="answer-text" data-who="partner" data-answered="${partnerAnswers[q.id] ? "yes" : "no"}">${esc(partnerAnswers[q.id] ?? "—")}</div>
        </div>
      </div>`).join("")}
    <button class="btn btn-block" data-start-new>Start a new check-in</button>
  `, "results");
}

function currentAnswers() {
  // read live textarea values if present, else stored
  const qs = questions();
  const out = { ...myAnswers };
  for (const q of qs) { const el = document.getElementById(`ans-${q.id}`); if (el) out[q.id] = el.value; }
  return out;
}

function render(html) {
  const root = document.getElementById("root");
  root.className = "";
  root.innerHTML = html;
}

function route() {
  stopPolling();
  if (!partner) return render(renderSetup());
  if (!partnerReciprocal) { render(renderWaitingReciprocal()); startPolling(); return; }
  if (!mySubmission) return render(renderQuestionnaire());
  if (!partnerSubmission) { render(renderWaitingPartner()); startPolling(); return; }
  if (!(mySubmission.revealed_at && partnerSubmission.revealed_at)) { render(renderRevealGate()); startPolling(); return; }
  render(renderResults());
}

// ── events ───────────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-save-partner]");
  if (!t) return;
  if (t.hasAttribute("data-save-partner")) {
    const sel = document.querySelector('input[name="partner"]:checked');
    if (!sel) { showError("Choose your partner first."); return; }
    savePartner(sel.value); return;
  }
  if (t.classList.contains("load-error-retry")) { refresh(); return; }
  if (t.hasAttribute("data-refresh")) { loadStatusAndRoute(); return; }
  if (t.hasAttribute("data-lockin")) { lockIn(); return; }
  if (t.hasAttribute("data-reveal")) { reveal(); return; }
  if (t.hasAttribute("data-start-new")) { startNew(); return; }
  if (t.hasAttribute("data-add-custom")) { openCustomModal(); return; }
  if (t.hasAttribute("data-remove-custom")) { removeCustom(t.getAttribute("data-remove-custom")); return; }
  if (t.hasAttribute("data-close")) { closeModal(); return; }
  if (t.hasAttribute("data-save-custom")) {
    const input = document.getElementById("custom-input");
    addCustom(input ? input.value : ""); return;
  }
});

async function loadStatusAndRoute() {
  try { await Promise.all([loadPartner(), loadCustoms(), loadMyAnswers()]); namePartner(); route(); }
  catch (e) { console.error(e); showError("Couldn’t load your check-in."); }
}

function openCustomModal() {
  openModal(`
    <h2>Add your own prompt</h2>
    <p class="muted tiny">Your partner will answer it too, in this check-in.</p>
    <input type="text" id="custom-input" data-autofocus maxlength="200" placeholder="e.g. What's one thing you'd love to plan together?" />
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" type="button" data-close>Cancel</button>
      <button class="btn btn-sm" type="button" data-save-custom>Add prompt</button>
    </div>
  `);
}

refresh();
</script>
</body>
</html>
